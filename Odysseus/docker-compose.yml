# docker-compose.yml
# Production deployment for MKZ Factory + Odysseus AI Workspace

services:
  # ==========================================
  # MKZ Factory Backend (ASP.NET Core)
  # ==========================================
  mkz-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: mkz-backend
    ports:
      - "127.0.0.1:5165:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # An unset password is intentionally inert: PostgreSQL refuses to start
      # until a real MKZ_DB_PASSWORD is supplied by the deployment environment.
      - ConnectionStrings__DefaultConnection=Host=mkz-db;Port=5432;Database=plc_monitoring;Username=postgres;Password=${MKZ_DB_PASSWORD:-}
      - Jwt__Key=${JWT_SECRET:-SUPER_SECRET_KEY_FOR_PRODUCTION_CHANGE_ME}
      - MqttServer__Port=1883
    depends_on:
      mkz-db:
        condition: service_healthy
    networks:
      - mkz-network
      - mkz-backend-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==========================================
  # MKZ PostgreSQL Database
  # ==========================================
  mkz-db:
    image: postgres:16-alpine
    container_name: mkz-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${MKZ_DB_PASSWORD:-}
      - POSTGRES_DB=plc_monitoring
    volumes:
      - mkz-db-data:/var/lib/postgresql/data
      - ../backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - mkz-backend-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # MQTT Broker (for PLCs)
  # ==========================================
  mkz-mqtt:
    image: eclipse-mosquitto:2
    container_name: mkz-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mkz-mqtt-data:/mosquitto/data
      - mkz-mqtt-logs:/mosquitto/log
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - mkz-network
    restart: unless-stopped

  # ==========================================
  # Odysseus AI Workspace
  # ==========================================
  odysseus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odysseus
    ports:
      - "127.0.0.1:7000:7000"
    environment:
      - AUTH_ENABLED=true
      - APP_BIND=0.0.0.0
      - APP_PORT=7000
      - DATABASE_URL=sqlite:///./data/app.db
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      # Local-development FastEmbed download workaround. This is an Odysseus
      # process setting; do not pass it to the ChromaDB server.
      - HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-}
      - SEARXNG_INSTANCE=http://searxng:8080
      # MKZ Integration
      # The factory database is not exposed to Odysseus. Read-only data flows
      # through the backend REST API on the shared MKZ network instead.
      - MKZ_BACKEND_URL=http://mkz-backend:8080
    volumes:
      - odysseus-data:/app/data
      - odysseus-logs:/app/logs
    depends_on:
      mkz-backend:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      searxng:
        condition: service_started
    networks:
      - mkz-network
      - odysseus-internal
    restart: unless-stopped

  # ==========================================
  # ChromaDB (Vector Database for RAG)
  # ==========================================
  chromadb:
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    container_name: chromadb
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - chromadb-data:/data
    networks:
      - odysseus-internal
    restart: unless-stopped
    healthcheck:
      # chromadb/chroma:latest does not include curl. Bash's TCP probe is
      # available in the image and proves that the HTTP listener is accepting
      # connections without depending on a stale v1 endpoint.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # SearXNG (Privacy-respecting search)
  # ==========================================
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8080:8080"
    volumes:
      - ./config/searxng:/etc/searxng:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
    networks:
      - odysseus-internal
    restart: unless-stopped

  # ==========================================
  # ntfy (Push notifications)
  # ==========================================
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: ntfy
    ports:
      - "8091:80"
    volumes:
      - ntfy-data:/data
    environment:
      - NTFY_BIND=:80
      - NTFY_DISK_CACHE_SIZE=500M
    networks:
      - odysseus-internal
    restart: unless-stopped

  # ==========================================
  # Sync Service (scheduled data sync)
  # ==========================================
  mkz-sync:
    build:
      context: .
      dockerfile: Dockerfile.sync
    container_name: mkz-sync
    environment:
      # Sync only uses the read-only REST API; it never opens the factory DB.
      - MKZ_BACKEND_URL=http://mkz-backend:8080
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-}
      - ODYSSEUS_ROOT=/app
      - SYNC_INTERVAL_SECONDS=${SYNC_INTERVAL_SECONDS:-3600}
    volumes:
      - odysseus-data:/app/data
    depends_on:
      mkz-backend:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - mkz-network
      - odysseus-internal
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          if ! python /app/scripts/sync_mkz_to_odysseus.py; then
            echo "MKZ sync failed; retrying after $${SYNC_INTERVAL_SECONDS}s" >&2
          fi
          sleep "$${SYNC_INTERVAL_SECONDS}"
        done
    restart: unless-stopped

# ==========================================
# Networks
# ==========================================
networks:
  mkz-network:
    driver: bridge
  # Database-only network: Odysseus and the sync worker never join it.
  mkz-backend-db:
    driver: bridge
    internal: true
  odysseus-internal:
    driver: bridge

# ==========================================
# Volumes
# ==========================================
volumes:
  mkz-db-data:
  mkz-mqtt-data:
  mkz-mqtt-logs:
  chromadb-data:
  odysseus-data:
  odysseus-logs:
  ntfy-data:
