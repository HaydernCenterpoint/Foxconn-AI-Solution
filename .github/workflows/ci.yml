name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Odysseus/requirements.txt

      - name: Test .NET services
        run: |
          dotnet test backend.Tests/backend.Tests.csproj --configuration Release
          dotnet test fusion-adapter.Tests/Fusion.Adapter.Tests.csproj --configuration Release
          dotnet test ClientPLC/ClientPLC.Tests/ClientPLC.Tests.csproj --configuration Release

      - name: Verify frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run lint
          npm --prefix frontend run i18n:check
          npm --prefix frontend run test:run
          npm --prefix frontend run build
          npm --prefix frontend run e2e:install
          npm --prefix frontend run e2e

      - name: Test Odysseus authentication
        working-directory: Odysseus
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest tests/test_auth_regressions.py tests/test_fii_sso.py -q

      - name: Test file watcher connector
        working-directory: factory-ai-platform/data-platform
        run: |
          python -m pip install pytest==8.0.0 pyyaml==6.0.1 psycopg2-binary==2.9.12 requests==2.31.0 fastapi==0.110.0 pydantic==2.6.0 httpx==0.27.0
          python -m pytest connectors/file_watcher/test_connector.py connectors/erp/test_erp_connector.py connectors/mes/test_mes_connector.py api/test_connector_api.py dualwrite/test_dualwrite.py -q

      - name: Reject known development secrets in tracked runtime files
        shell: pwsh
        run: |
          $matches = git grep -n -I -E 'Password=12345678|factory_secure_password_9988|JWT_SECRET=.*factory-jwt-secret-key|MINIO_ROOT_PASSWORD: minio_secure_password' -- . ':(exclude).github/workflows/ci.yml' ':(exclude)**/tests/**' ':(exclude)backend.Tests/**'
          if ($LASTEXITCODE -eq 0) {
            $matches | Write-Error
            throw 'Tracked runtime files contain known development secrets.'
          }
          if ($LASTEXITCODE -ne 1) {
            throw "git grep failed with exit code $LASTEXITCODE."
          }
          exit 0
