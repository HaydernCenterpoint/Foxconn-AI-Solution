name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify Open Data Fusion submodule
        shell: pwsh
        run: |
          $path = git config --file .gitmodules --get 'submodule.third_party/open-data-fusion.path'
          if ($path -ne 'third_party/open-data-fusion') {
            throw "Unexpected Open Data Fusion submodule path: $path"
          }

          $treeEntry = git ls-tree HEAD -- $path
          if (-not $treeEntry.StartsWith('160000 commit ')) {
            throw "Open Data Fusion is not pinned as a git submodule: $treeEntry"
          }

          $expectedCommit = ($treeEntry -split '\s+')[2]
          $actualCommit = git -C $path rev-parse HEAD
          if ($actualCommit -ne $expectedCommit) {
            throw "Open Data Fusion checkout $actualCommit does not match pin $expectedCommit."
          }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Test local release and evidence validators (synthetic self-tests only)
        shell: pwsh
        run: |
          ./infrastructure/demo/Test-FullDemo.Static.Tests.ps1
          ./infrastructure/staging/Test-ManagedStagingEvidence.Tests.ps1
          ./infrastructure/release/Test-G0ScopeLock.Tests.ps1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            Odysseus/requirements.txt
            factory-ai-platform/**/requirements*.txt

      - name: Test .NET services
        run: |
          dotnet test backend.Tests/backend.Tests.csproj --configuration Release
          dotnet test fusion-adapter.Tests/Fusion.Adapter.Tests.csproj --configuration Release
          dotnet test ClientPLC/ClientPLC.Tests/ClientPLC.Tests.csproj --configuration Release

      - name: Verify frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run lint -- --max-warnings=0
          npm --prefix frontend run type-check
          npm --prefix frontend run i18n:check
          npm --prefix frontend run test:run
          npm --prefix frontend run build
          npm --prefix frontend run e2e:install
          npm --prefix frontend run e2e

      - name: Verify pinned Open Data Fusion authority
        working-directory: third_party/open-data-fusion
        run: |
          npm ci
          npm run check

      - name: Test Odysseus authentication
        working-directory: Odysseus
        run: |
          python -m venv --clear .venv-ci
          .\.venv-ci\Scripts\python -m pip install -r requirements-dev.txt
          .\.venv-ci\Scripts\python -m pytest tests/test_auth_regressions.py tests/test_fii_sso.py -q

      - name: Test data platform
        working-directory: factory-ai-platform/data-platform
        run: |
          python -m venv --clear .venv-ci
          .\.venv-ci\Scripts\python -m pip install -r requirements.txt
          .\.venv-ci\Scripts\python -m pip install -r requirements-dev.txt
          .\.venv-ci\Scripts\python -m pytest -q

      - name: Test Antigravity Bridge
        working-directory: factory-ai-platform/antigravity-bridge
        run: |
          python -m venv --clear .venv-ci
          .\.venv-ci\Scripts\python -m pip install -r requirements-dev.txt
          .\.venv-ci\Scripts\python -m pytest tests -q

      - name: Lint and test CEP service
        working-directory: factory-ai-platform/cep-service
        run: |
          python -m venv --clear .venv-ci
          .\.venv-ci\Scripts\python -m pip install -r requirements-dev.txt
          .\.venv-ci\Scripts\python -m ruff check app tests
          .\.venv-ci\Scripts\python -m pytest tests -q

      - name: Test asset service
        working-directory: factory-ai-platform/asset-service
        env:
          DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
          SYNC_DATABASE_URL: 'sqlite:///:memory:'
          JWT_SECRET: asset-test-secret-at-least-32-characters
        run: |
          python -m venv --clear .venv-ci
          .\.venv-ci\Scripts\python -m pip install -r requirements-dev.txt
          .\.venv-ci\Scripts\python -m pytest tests -q

      - name: Test gateway hermetic suite
        working-directory: factory-ai-platform/gateway
        run: |
          python -m venv --clear .venv-ci
          .\.venv-ci\Scripts\python -m pip install -r requirements-dev.txt
          .\.venv-ci\Scripts\python -m pytest tests -q

      - name: Verify document service
        working-directory: factory-ai-platform/document-service
        run: |
          python -m venv --clear .venv-ci
          .\.venv-ci\Scripts\python -m pip install -r requirements-dev.txt
          .\.venv-ci\Scripts\python -m compileall -q app

      - name: Test report service
        working-directory: factory-ai-platform/report-service
        run: |
          python -m venv --clear .venv-ci
          .\.venv-ci\Scripts\python -m pip install -r requirements-dev.txt
          .\.venv-ci\Scripts\python -m compileall -q app
          .\.venv-ci\Scripts\python -m pytest tests -q

      - name: Reject known development secrets in tracked runtime files
        shell: pwsh
        run: |
          $matches = git grep -n -I -E 'Password=12345678|factory_secure_password_9988|JWT_SECRET=.*factory-jwt-secret-key|MINIO_ROOT_PASSWORD: minio_secure_password' -- . ':(exclude).github/workflows/ci.yml' ':(exclude)**/tests/**' ':(exclude)backend.Tests/**'
          if ($LASTEXITCODE -eq 0) {
            $matches | Write-Error
            throw 'Tracked runtime files contain known development secrets.'
          }
          if ($LASTEXITCODE -ne 1) {
            throw "git grep failed with exit code $LASTEXITCODE."
          }
          exit 0
