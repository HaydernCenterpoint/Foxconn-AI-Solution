# ============================================
# TimescaleDB Migration Docker Setup
# ============================================

services:
  # TimescaleDB Service (replaces standard PostgreSQL for time-series)
  timescaledb:
    image: timescale/timescaledb:2.28.3-pg17
    container_name: factory-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: factory_db
      POSTGRES_USER: factory_user
      POSTGRES_PASSWORD: ${FII_DATA_POSTGRES_PASSWORD:?Set FII_DATA_POSTGRES_PASSWORD}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./migrations/001_timescale_setup.sql:/docker-entrypoint-initdb.d/001_timescale_setup.sql:ro
      - ../../infrastructure/connectors/001_connector_schema.sql:/docker-entrypoint-initdb.d/003_connector_schema.sql:ro
    ports:
      - "127.0.0.1:${FII_DATA_TIMESCALE_PORT:-55434}:5432"
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory_user -d factory_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Data Platform API
  data-platform-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: data-platform-api
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=timescaledb
      - POSTGRES_PORT=5432
      - POSTGRES_DB=factory_db
      - POSTGRES_USER=factory_user
      - POSTGRES_PASSWORD=${FII_DATA_POSTGRES_PASSWORD:?Set FII_DATA_POSTGRES_PASSWORD}
      - CONNECTOR_API_KEY=${CONNECTOR_API_KEY:?Set CONNECTOR_API_KEY via the deployment secret manager}
      - CONNECTOR_CORS_ORIGINS=${CONNECTOR_CORS_ORIGINS:-}
    ports:
      - "127.0.0.1:${FII_DATA_API_PORT:-8084}:8084"
    networks:
      - factory-net
      - db-net
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ERP Connector Worker
  erp-connector:
    build:
      context: .
      dockerfile: Dockerfile.connector
    container_name: erp-connector
    restart: unless-stopped
    command: python -m connectors.erp.connector --daemon
    environment:
      - DUAL_WRITE_MODE=${DUAL_WRITE_MODE:-migration}
      - POSTGRES_HOST=${LEGACY_POSTGRES_HOST:-timescaledb}
      - POSTGRES_PORT=${LEGACY_POSTGRES_PORT:-5432}
      - POSTGRES_DB=${LEGACY_POSTGRES_DB:-factory_db}
      - POSTGRES_USER=${LEGACY_POSTGRES_USER:-factory_user}
      - POSTGRES_PASSWORD=${LEGACY_POSTGRES_PASSWORD:-${FII_DATA_POSTGRES_PASSWORD:?Set FII_DATA_POSTGRES_PASSWORD}}
      - CONNECTOR_POSTGRES_HOST=timescaledb
      - CONNECTOR_POSTGRES_PORT=5432
      - CONNECTOR_POSTGRES_DB=factory_db
      - CONNECTOR_POSTGRES_USER=factory_user
      - CONNECTOR_POSTGRES_PASSWORD=${FII_DATA_POSTGRES_PASSWORD:?Set FII_DATA_POSTGRES_PASSWORD}
      - TS_POSTGRES_HOST=timescaledb
      - TS_POSTGRES_PORT=5432
      - TS_POSTGRES_DB=factory_db
      - TS_POSTGRES_USER=factory_user
      - TS_POSTGRES_PASSWORD=${FII_DATA_POSTGRES_PASSWORD:?Set FII_DATA_POSTGRES_PASSWORD}
      - ERP_API_URL=${ERP_API_URL:-http://erp-service:8080/api}
      - ERP_API_KEY=${ERP_API_KEY:-}
      - ERP_SYNC_INTERVAL=300
    networks:
      - factory-net
      - db-net
    depends_on:
      timescaledb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # MES Connector Worker
  mes-connector:
    profiles: ["mes"]
    build:
      context: .
      dockerfile: Dockerfile.connector
    container_name: mes-connector
    restart: unless-stopped
    command: python -m connectors.mes.connector --daemon
    environment:
      - DUAL_WRITE_MODE=${DUAL_WRITE_MODE:-migration}
      - POSTGRES_HOST=${LEGACY_POSTGRES_HOST:-timescaledb}
      - POSTGRES_PORT=${LEGACY_POSTGRES_PORT:-5432}
      - POSTGRES_DB=${LEGACY_POSTGRES_DB:-factory_db}
      - POSTGRES_USER=${LEGACY_POSTGRES_USER:-factory_user}
      - POSTGRES_PASSWORD=${LEGACY_POSTGRES_PASSWORD:-${FII_DATA_POSTGRES_PASSWORD:?Set FII_DATA_POSTGRES_PASSWORD}}
      - CONNECTOR_POSTGRES_HOST=timescaledb
      - CONNECTOR_POSTGRES_PORT=5432
      - CONNECTOR_POSTGRES_DB=factory_db
      - CONNECTOR_POSTGRES_USER=factory_user
      - CONNECTOR_POSTGRES_PASSWORD=${FII_DATA_POSTGRES_PASSWORD:?Set FII_DATA_POSTGRES_PASSWORD}
      - TS_POSTGRES_HOST=timescaledb
      - TS_POSTGRES_PORT=5432
      - TS_POSTGRES_DB=factory_db
      - TS_POSTGRES_USER=factory_user
      - TS_POSTGRES_PASSWORD=${FII_DATA_POSTGRES_PASSWORD:?Set FII_DATA_POSTGRES_PASSWORD}
      - MES_CONNECTION_TYPE=${MES_CONNECTION_TYPE:-api}
      - MES_API_URL=${MES_API_URL:-http://mes-service:8080/api}
      - MES_API_KEY=${MES_API_KEY:-}
    networks:
      - factory-net
      - db-net
    depends_on:
      timescaledb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # File Watcher Connector
  file-watcher-connector:
    build:
      context: .
      dockerfile: Dockerfile.connector
    container_name: file-watcher-connector
    restart: unless-stopped
    command: python -m connectors.file_watcher.connector --daemon
    volumes:
      - ./incoming:/app/incoming:ro
      - ./processed:/app/processed
      - ./failed:/app/failed
    environment:
      - DUAL_WRITE_MODE=${DUAL_WRITE_MODE:-migration}
      - POSTGRES_HOST=${LEGACY_POSTGRES_HOST:-timescaledb}
      - POSTGRES_PORT=${LEGACY_POSTGRES_PORT:-5432}
      - POSTGRES_DB=${LEGACY_POSTGRES_DB:-factory_db}
      - POSTGRES_USER=${LEGACY_POSTGRES_USER:-factory_user}
      - POSTGRES_PASSWORD=${LEGACY_POSTGRES_PASSWORD:-${FII_DATA_POSTGRES_PASSWORD:?Set FII_DATA_POSTGRES_PASSWORD}}
      - CONNECTOR_POSTGRES_HOST=timescaledb
      - CONNECTOR_POSTGRES_PORT=5432
      - CONNECTOR_POSTGRES_DB=factory_db
      - CONNECTOR_POSTGRES_USER=factory_user
      - CONNECTOR_POSTGRES_PASSWORD=${FII_DATA_POSTGRES_PASSWORD:?Set FII_DATA_POSTGRES_PASSWORD}
      - TS_POSTGRES_HOST=timescaledb
      - TS_POSTGRES_PORT=5432
      - TS_POSTGRES_DB=factory_db
      - TS_POSTGRES_USER=factory_user
      - TS_POSTGRES_PASSWORD=${FII_DATA_POSTGRES_PASSWORD:?Set FII_DATA_POSTGRES_PASSWORD}
      - FILE_WATCHER_DIRS=/app/incoming
      - FILE_WATCHER_POLL_INTERVAL=30
    networks:
      - factory-net
      - db-net
    depends_on:
      timescaledb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Backfill Service (run-once job)
  backfill-job:
    build:
      context: .
      dockerfile: Dockerfile.connector
    container_name: backfill-job
    restart: "no"
    command: python -m backfill.backfill --resume
    environment:
      - POSTGRES_HOST=timescaledb
      - POSTGRES_PORT=5432
      - POSTGRES_DB=factory_db
      - POSTGRES_USER=factory_user
      - POSTGRES_PASSWORD=${FII_DATA_POSTGRES_PASSWORD:?Set FII_DATA_POSTGRES_PASSWORD}
    networks:
      - db-net
    depends_on:
      timescaledb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

networks:
  factory-net:
    driver: bridge
  db-net:
    driver: bridge

volumes:
  timescaledb_data:
