networks:
  factory-net:
    driver: bridge
    internal: false  # Allows downloading updates and calling external APIs if needed
  db-net:
    driver: bridge
    internal: true   # Database only accessible inside internal network for high security

volumes:
  postgres_data:
  minio_data:
  report_service_data:

services:
  postgres:
    image: pgvector/pgvector:0.7.0-pg16
    container_name: factory-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-factory_db}
      POSTGRES_USER: ${POSTGRES_USER:-factory_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD via the deployment secret manager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db-net
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432"  # Local debugging only; override deliberately if remote access is required
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory_user -d factory_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.2-alpine
    container_name: factory-redis
    restart: always
    networks:
      - factory-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:RELEASE.2024-03-03T20-28-49Z
    container_name: factory-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER via the deployment secret manager}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD via the deployment secret manager}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:9001:9001"
    networks:
      - factory-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  factory-ai-gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    container_name: factory-ai-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ANTIGRAVITY_BRIDGE_URL=${ANTIGRAVITY_BRIDGE_URL:?Set ANTIGRAVITY_BRIDGE_URL to the production bridge endpoint}
      - DOCUMENT_SERVICE_URL=http://document-service:8082
      - REPORT_SERVICE_URL=http://report-service:8083
      - REPORT_SERVICE_API_KEY=${REPORT_SERVICE_API_KEY:?Set REPORT_SERVICE_API_KEY via the deployment secret manager}
      - BACKEND_URL=${BACKEND_URL:?Set BACKEND_URL to the production backend endpoint}
      - LLM_API_URL=${LLM_API_URL:?Set LLM_API_URL to the production LLM endpoint}
      - LLM_API_KEY=${LLM_API_KEY:?Set LLM_API_KEY via the deployment secret manager}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - AI_SERVICE_USER=${AI_SERVICE_USER:-ai_service}
      - AI_SERVICE_PASSWORD=${AI_SERVICE_PASSWORD:?Set AI_SERVICE_PASSWORD via the deployment secret manager}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET via the deployment secret manager}
    networks:
      - factory-net
      - db-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      report-service:
        condition: service_healthy
        required: false
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  antigravity-bridge:
    build:
      context: ../antigravity-bridge
      dockerfile: Dockerfile
    container_name: antigravity-bridge
    restart: always
    environment:
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-production}
      - MOCK_ANTIGRAVITY=${MOCK_ANTIGRAVITY:?Set MOCK_ANTIGRAVITY=false for production or use DEPLOYMENT_MODE=local-demo explicitly}
    command:
      - /bin/sh
      - -ec
      - |
        if [ "$${DEPLOYMENT_MODE}" = "production" ]; then
          [ "$${MOCK_ANTIGRAVITY}" = "false" ] || {
            echo "MOCK_ANTIGRAVITY must be false in production" >&2
            exit 64
          }
        elif [ "$${DEPLOYMENT_MODE}" != "local-demo" ]; then
          echo "DEPLOYMENT_MODE must be production or local-demo" >&2
          exit 64
        fi
        exec uvicorn app.main:app --host 0.0.0.0 --port 8081
    volumes:
      # Mount only the explicitly selected workspace; never default to a host drive or home directory.
      - type: bind
        source: ${ANTIGRAVITY_WORKSPACE_HOST_PATH:?Set ANTIGRAVITY_WORKSPACE_HOST_PATH to the single host workspace directory}
        target: /workspace
    networks:
      - factory-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  document-service:
    build:
      context: ../document-service
      dockerfile: Dockerfile
    container_name: document-service
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-factory_db}
      - POSTGRES_USER=${POSTGRES_USER:-factory_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD via the deployment secret manager}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
    networks:
      - factory-net
      - db-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  report-service:
    build:
      context: ../report-service
      dockerfile: Dockerfile
    container_name: report-service
    restart: always
    deploy:
      replicas: 1
    environment:
      - REPORT_SERVICE_API_KEY=${REPORT_SERVICE_API_KEY:?Set REPORT_SERVICE_API_KEY via the deployment secret manager}
      - REPORT_DOWNLOAD_SIGNING_KEY=${REPORT_DOWNLOAD_SIGNING_KEY:?Set REPORT_DOWNLOAD_SIGNING_KEY to an independent secret of at least 32 bytes}
      - REPORT_SERVICE_MODE=production
      - REPORT_SERVICE_REPLICA_COUNT=1
      - LOCAL_REPORTS_DIR=/var/lib/report-service
      - LOCAL_REPORTS_BASE_URL=${REPORT_PUBLIC_BASE_URL:?Set REPORT_PUBLIC_BASE_URL to the externally reachable HTTPS report-service URL}/local-files
      - REPORT_PUBLIC_HOST_ALLOWLIST=${REPORT_PUBLIC_HOST_ALLOWLIST:?Set REPORT_PUBLIC_HOST_ALLOWLIST to the exact public report host}
    volumes:
      - report_service_data:/var/lib/report-service
    networks:
      - factory-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  asset-service:
    build:
      context: ../asset-service
      dockerfile: Dockerfile
    container_name: asset-service
    restart: always
    ports:
      - "8084:8084"
    environment:
      - DATABASE_URL=${ASSET_DATABASE_URL:?Set ASSET_DATABASE_URL via the deployment secret manager}
      - SYNC_DATABASE_URL=${ASSET_SYNC_DATABASE_URL:?Set ASSET_SYNC_DATABASE_URL via the deployment secret manager}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET via the deployment secret manager}
      - DEBUG=${DEBUG:-false}
    networks:
      - factory-net
      - db-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  asset-health-job:
    build:
      context: ../asset-service
      dockerfile: Dockerfile
    container_name: asset-health-job
    restart: always
    command: ["python", "-m", "app.scripts.health_score_job", "--daemon", "--interval", "15"]
    environment:
      - DATABASE_URL=${ASSET_DATABASE_URL:?Set ASSET_DATABASE_URL via the deployment secret manager}
      - SYNC_DATABASE_URL=${ASSET_SYNC_DATABASE_URL:?Set ASSET_SYNC_DATABASE_URL via the deployment secret manager}
    networks:
      - factory-net
      - db-net
    depends_on:
      postgres:
        condition: service_healthy
      asset-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  cep-service:
    build:
      context: ../cep-service
      dockerfile: Dockerfile
    container_name: cep-service
    restart: always
    ports:
      - "8085:8084"
    environment:
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=${CEP_POSTGRES_URL:?Set CEP_POSTGRES_URL via the deployment secret manager}
      - BACKEND_URL=${BACKEND_URL:?Set BACKEND_URL to the production backend endpoint}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET via the deployment secret manager}
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-production}
      - CEP_MODE=${CEP_MODE:?Set CEP_MODE=live for production or use DEPLOYMENT_MODE=local-demo explicitly}
    command:
      - /bin/sh
      - -ec
      - |
        if [ "$${DEPLOYMENT_MODE}" = "production" ]; then
          [ "$${CEP_MODE}" = "live" ] || {
            echo "CEP_MODE must be live in production" >&2
            exit 64
          }
        elif [ "$${DEPLOYMENT_MODE}" != "local-demo" ]; then
          echo "DEPLOYMENT_MODE must be production or local-demo" >&2
          exit 64
        fi
        exec uvicorn app.main:app --host 0.0.0.0 --port 8084
    networks:
      - factory-net
      - db-net
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 15s
      timeout: 5s
      retries: 3
