services:
  timescaledb:
    image: timescale/timescaledb:2.28.3-pg17
    environment:
      POSTGRES_DB: plc_timescale
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FII_TIMESCALE_PASSWORD:?Set FII_TIMESCALE_PASSWORD}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data

volumes:
  timescale-data:
