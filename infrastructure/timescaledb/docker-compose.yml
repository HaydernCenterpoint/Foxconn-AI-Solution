services:
  timescaledb:
    image: timescale/timescaledb:2.28.3-pg17
    environment:
      POSTGRES_DB: plc_timescale
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
    ports:
      - "55433:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data

volumes:
  timescale-data:
