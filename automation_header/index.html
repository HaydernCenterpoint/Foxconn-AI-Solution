<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tự động hóa</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <section class="hud" aria-label="Thanh điều khiển tự động hóa">
      <svg class="hud-bg" viewBox="0 0 2048 116" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#04122d"/>
            <stop offset="0.5" stop-color="#020b20"/>
            <stop offset="1" stop-color="#04122d"/>
          </linearGradient>
          <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#0385ff"/>
            <stop offset="0.5" stop-color="#00f3ff"/>
            <stop offset="1" stop-color="#0385ff"/>
          </linearGradient>
          <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3.4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="8" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <path d="M0 0H774L848 94H1198L1262 0H2048V116H0Z" fill="url(#bg)"/>
        <path d="M0 16H365L373 22H786L848 96H1197L1263 20H1656L1664 14H2048" fill="none" stroke="#0ca9ff" stroke-width="2" opacity=".75"/>
        <path d="M0 102L12 114H972M1090 114H2035L2048 102" fill="none" stroke="#00f4ff" stroke-width="3" filter="url(#glow)"/>
        <path d="M0 0H784L848 94H1198L1262 0H2048" fill="none" stroke="#00efff" stroke-width="2.5" filter="url(#glow)"/>
        <path d="M674 0H787L848 94H1198L1261 0H1369" fill="none" stroke="#00efff" stroke-width="3" filter="url(#softGlow)"/>

        <!-- left decorative block -->
        <g opacity=".95" fill="none" stroke="url(#cyan)" stroke-width="2">
          <path d="M542 28l42 44M554 28l42 44M566 28l42 44M578 28l42 44M590 28l42 44M602 28l42 44M614 28l42 44M626 28l42 44M638 28l42 44"/>
          <path d="M660 29h116l34 43H694z" opacity=".65"/>
          <path d="M709 17h72"/>
        </g>

        <!-- right decorative block -->
        <g opacity=".95" fill="none" stroke="url(#cyan)" stroke-width="2">
          <path d="M1505 28l-42 44M1493 28l-42 44M1481 28l-42 44M1469 28l-42 44M1457 28l-42 44M1445 28l-42 44M1433 28l-42 44M1421 28l-42 44M1409 28l-42 44"/>
          <path d="M1387 29h-116l-34 43h116z" opacity=".65"/>
          <path d="M1338 17h-72"/>
        </g>
      </svg>

      <div class="hud-content">
        <div class="line-control">
          <span class="label">LINE:</span>
          <button class="select-btn" type="button" aria-haspopup="listbox">
            <span>TẤT CẢ</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 7 6-7z"/></svg>
          </button>
        </div>

        <h1 class="title">TỰ ĐỘNG HÓA</h1>

        <div class="right-actions">
          <div class="clock-wrap">
            <svg class="clock-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5"/>
              <path d="M12 7v5l3 2"/>
            </svg>
            <time id="clock">2026.07.07 15:27:00</time>
          </div>
          <button class="icon-btn" type="button" aria-label="Toàn màn hình">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/>
              <path d="M3 8l6-5M21 8l-6-5M3 16l6 5M21 16l-6 5"/>
            </svg>
          </button>
          <button class="icon-btn danger" type="button" aria-label="Đóng">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
          </button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const clock = document.getElementById('clock');
    const pad = n => String(n).padStart(2, '0');
    const renderClock = () => {
      const d = new Date();
      clock.textContent = `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    };
    renderClock();
    setInterval(renderClock, 1000);

    document.querySelector('[aria-label="Toàn màn hình"]').addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      } catch (_) {}
    });
  </script>
</body>
</html>
